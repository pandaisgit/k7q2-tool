<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='default'>
<meta name='apple-mobile-web-app-title' content='Collage'>
<meta name='theme-color' content='#f5f5f7'>
<title>Collage</title>
<style>
:root{--bg:#f5f5f7;--panel:rgba(255,255,255,.82);--text:#111;--muted:#8a8a8e;--line:rgba(0,0,0,.08);--accent:#0a84ff;--chip:#e8e8ed;--stage:#ececf0}
[data-theme=dark]{--bg:#000;--panel:rgba(28,28,30,.82);--text:#f2f2f7;--muted:#8e8e93;--line:rgba(255,255,255,.1);--chip:#2c2c2e;--stage:#111113}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.3 -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app.clean .ui{display:none!important}
.hdr{display:flex;align-items:center;gap:8px;padding:8px 14px 6px}
.hdr .t{flex:1;min-width:0}
.hdr h1{font-size:17px;font-weight:600;margin:0}
.hdr small{color:var(--muted);font-size:12px}
.ib{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:var(--chip)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:var(--stage)}
#cv{flex:none;touch-action:none;box-shadow:0 2px 16px rgba(0,0,0,.18)}
.crow{display:flex;align-items:center;gap:5px;padding:4px 8px 2px;background:var(--bg)}
.sm{flex:none;width:30px;height:30px;border-radius:15px;display:grid;place-items:center;background:var(--chip)}
.sm svg{width:16px;height:16px}
.sp{flex:1}
#cb{flex:none;display:flex;flex-direction:column;align-items:center;min-width:54px;line-height:1.15}
#cnt{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
#left{color:var(--muted);font-size:11px;white-space:nowrap}
.primary{flex:1;height:46px;border-radius:14px;background:var(--text);color:var(--bg);font-weight:600;font-size:16px}
.hero{flex:none;width:min(80vw,340px);height:min(30vh,170px);border-radius:38px;background:var(--text);color:var(--bg);font:500 42px/1 Didot,'Bodoni 72','Playfair Display',Georgia,serif;letter-spacing:.02em;font-variant-numeric:tabular-nums;box-shadow:0 22px 48px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s}
.hero:active{transform:scale(.97)}
.hero:disabled{pointer-events:none}
#tray{display:flex;gap:8px;overflow-x:auto;padding:4px 10px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--bg)}
#tray::-webkit-scrollbar{display:none}
.th{flex:none;width:56px;height:56px;border-radius:10px;overflow:hidden;position:relative;background:var(--chip)}
.th img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.th.cur{outline:3px solid var(--accent);outline-offset:-3px}
.bd,.bd2{position:absolute;left:4px;bottom:4px;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:600;place-items:center}
.bd{display:none}
.bd2{display:grid}
.th.add{display:grid;place-items:center;font-size:26px;color:var(--muted)}
#sheet{display:none;padding:10px 14px 10px;background:var(--panel);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.lbl,.hint{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:16px;background:var(--chip)}
.chip.sm2{padding:6px 12px;font-size:15px}
.chip.on{background:var(--accent);color:#fff}
.cust{margin-top:10px;display:flex;align-items:center;gap:8px}
.cust input{width:70px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--text);font:inherit;text-align:center}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:2px}
.seg button{flex:1;padding:7px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.sl{display:flex;align-items:center;gap:10px;margin-top:8px}
.sl>span{width:44px;color:var(--muted);font-size:13px}
.sl b{width:36px;text-align:right;font-weight:500;font-size:13px}
.sl input[type=range]{flex:1;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:28px;margin:0;outline:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,50%),rgba(120,120,128,.3) var(--p,50%));border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:12px;background:#fff;border:0;margin-top:-10px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.swt{flex:none;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.swt input{display:none}
.swt i{width:38px;height:22px;border-radius:11px;background:rgba(120,120,128,.3);position:relative;transition:background .2s}
.swt i::after{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.swt input:checked+i{background:var(--accent)}
.swt input:checked+i::after{transform:translateX(16px)}
.sws{display:flex;gap:8px;margin-top:6px;padding:6px 6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.sw{flex:none;width:34px;height:34px;border-radius:17px;border:1px solid var(--line);position:relative}
.sw.s{width:28px;height:28px;border-radius:14px}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.sw.cust{border:1.5px dashed var(--muted);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.sw.cust svg{width:15px;height:15px}
.sw.cust.filled{border:1px solid var(--line)}
.sw.cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.lk2{display:flex;gap:16px}
.lnk{color:var(--accent);font-size:14px}
.trow{display:flex;gap:12px;align-items:center}
.ti{width:100%;margin-top:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--text);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.tg{display:flex;gap:6px}
.tg button{width:34px;height:34px;border-radius:10px;background:var(--chip)}
.tg button.on{background:var(--accent);color:#fff}
.lrow{display:flex;align-items:center;gap:8px}
.flips{flex:none;display:flex;flex-direction:column;gap:6px}
.flips button{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center}
.flips svg{width:18px;height:18px}
.lays{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.lay{flex:none;padding:3px;border-radius:9px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.lay canvas{display:block;border-radius:4px}
.lay.on{border-color:var(--accent)}
.tools{display:flex;justify-content:space-around;padding:2px 2px 0;border-top:1px solid var(--line);background:var(--panel);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tools button{flex:1;display:grid;place-items:center;color:var(--muted);padding:9px 0}
.tools button svg{width:23px;height:23px}
.tools button.on{color:var(--accent)}
.tools button:disabled{opacity:.3}
#ghost{position:fixed;width:86px;height:86px;border-radius:12px;background-size:cover;background-position:center;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;display:none;z-index:50;transform:translate(-50%,-50%) scale(1.05);opacity:.92}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;white-space:nowrap}
#toast.on{opacity:.95}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:110;color:#fff;font-size:17px}
#busy.on{display:grid}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
#grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:12px 14px;align-content:start}
.cell{position:relative}
.cell canvas{width:100%;height:auto;display:block;border-radius:4px;box-shadow:0 1px 8px rgba(0,0,0,.2)}
.cell .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;font-size:11px;padding:2px 7px}
.cbar{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
.cbar button{width:28px;height:28px;border-radius:14px;background:rgba(0,0,0,.55);color:#fff;font-size:17px;line-height:1;display:grid;place-items:center;padding-bottom:2px}
.foot{padding:10px 14px 8px;border-top:1px solid var(--line)}
.primary{flex:1;height:46px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:80;display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.ov.on{display:flex}
.lhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.lhead b{font-size:17px}
.lhead small{color:var(--muted);margin-left:8px;font-size:12px}
#libgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px;align-content:start}
.lc{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--chip)}
.lc img{width:100%;height:100%;object-fit:cover;display:block}
.lc.off img{opacity:.25;filter:grayscale(1)}
.lc .ck{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:11px;border:2px solid #fff;background:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-size:12px}
.lc .ck::after{content:'\2713'}
.lc.off .ck{background:rgba(0,0,0,.3)}
.lc.off .ck::after{content:''}
.lfoot{padding:10px 14px 8px;border-top:1px solid var(--line);display:flex;justify-content:center}
.sov{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:90;display:none;align-items:flex-end}
.sov.on{display:flex}
.card{width:100%;background:var(--bg);border-radius:22px 22px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.card button{padding:14px;border-radius:14px;background:var(--chip);font-size:16px}
.card .danger{color:#ff3b30}
</style>
</head>
<body>
<div id='app'>

<section class='screen on' id='s-import'>
  <div class='center'>
    <button class='hero' id='pick'>Collage</button>
  </div>
</section>

<section class='screen' id='s-build'>
  <div id='stage'><canvas id='cv'></canvas></div>
  <div class='crow ui' id='crow'>
    <button class='sm' id='prev' aria-label='Previous'><svg viewBox='0 0 24 24'><path d='M15 5l-7 7 7 7'/></svg></button>
    <div id='cb'><span id='cnt'>1 / 1</span><span id='left'></span></div>
    <button class='sm' id='next' aria-label='Next'><svg viewBox='0 0 24 24'><path d='M9 5l7 7-7 7'/></svg></button>
    <button class='sm' id='add' aria-label='New collage'><svg viewBox='0 0 24 24'><path d='M12 5v14M5 12h14'/></svg></button>
    <span class='sp'></span>
    <button class='sm' id='over' aria-label='Start over'><svg viewBox='0 0 24 24'><path d='M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.8L3 8'/><path d='M3 3v5h5'/></svg></button>
    <button class='sm' id='theme' aria-label='Dark mode'><svg viewBox='0 0 24 24'><circle cx='12' cy='12' r='8'/><path d='M12 4a8 8 0 010 16z' fill='currentColor'/></svg></button>
    <button class='sm' id='rev' aria-label='All collages'><svg viewBox='0 0 24 24'><rect x='4' y='4' width='7' height='7' rx='1'/><rect x='13' y='4' width='7' height='7' rx='1'/><rect x='4' y='13' width='7' height='7' rx='1'/><rect x='13' y='13' width='7' height='7' rx='1'/></svg></button>
    <button class='sm' id='eye' aria-label='Full screen preview'><svg viewBox='0 0 24 24'><path d='M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z'/><circle cx='12' cy='12' r='3'/></svg></button>
  </div>
  <div id='tray' class='ui'></div>
  <div id='sheet' class='ui'></div>
  <div class='tools ui' id='tools'>
    <button data-a='undo' aria-label='Undo'><svg viewBox='0 0 24 24'><path d='M9 14L4 9l5-5'/><path d='M4 9h10a6 6 0 010 12h-3'/></svg></button>
    <button data-a='redo' aria-label='Redo'><svg viewBox='0 0 24 24'><path d='M15 14l5-5-5-5'/><path d='M20 9H10a6 6 0 000 12h3'/></svg></button>
    <button data-a='ratio' aria-label='Aspect ratio'><svg viewBox='0 0 24 24'><rect x='4' y='6' width='16' height='12' rx='2'/></svg></button>
    <button data-a='layout' aria-label='Layout'><svg viewBox='0 0 24 24'><rect x='3' y='3' width='18' height='18' rx='2'/><path d='M3 12h18M12 12v9'/></svg></button>
    <button data-a='fit' aria-label='Fit or fill'><svg viewBox='0 0 24 24'><path d='M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5'/></svg></button>
    <button data-a='border' aria-label='Border'><svg viewBox='0 0 24 24'><rect x='3' y='3' width='18' height='18' rx='2'/><rect x='8' y='8' width='8' height='8'/></svg></button>
    <button data-a='color' aria-label='Color'><svg viewBox='0 0 24 24'><circle cx='12' cy='12' r='8'/><path d='M12 4a8 8 0 010 16z' fill='currentColor'/></svg></button>
    <button data-a='text' aria-label='Text'><svg viewBox='0 0 24 24'><path d='M5 6h14M12 6v13M9 19h6'/></svg></button>
  </div>
</section>

<section class='screen' id='s-review'>
  <div class='hdr'>
    <button class='ib' id='back' aria-label='Back'><svg viewBox='0 0 24 24'><path d='M15 5l-7 7 7 7'/></svg></button>
    <div class='t'><h1>Review</h1><small id='rsub'></small></div>
  </div>
  <div id='grid'></div>
  <div class='foot'><button class='primary' id='save' style='width:100%'>Save all</button></div>
</section>

</div>

<div id='lib' class='ov'>
  <div class='lhead'><div><b>Your photos</b><small id='libcnt'></small></div><button class='lnk' id='libdone'><b>Done</b></button></div>
  <div id='libgrid'></div>
  <div class='lfoot'><button class='chip' id='libadd'>Add more photos</button></div>
</div>

<div id='act' class='sov'>
  <div class='card'>
    <button data-o='reset'>Reset this collage</button>
    <button data-o='dup'>Duplicate this collage</button>
    <button data-o='clear' class='danger'>Clear all collages</button>
    <button data-o='scratch' class='danger'>Start from scratch</button>
    <button data-o='cancel'>Cancel</button>
  </div>
</div>

<input type='file' id='file' accept='image/*' multiple hidden>
<div id='ghost'></div><div id='toast'></div><div id='busy'></div>

<script>
(()=>{

const S={photos:[],collages:[],cur:0,sel:0,tool:null,editKey:null,custom:false,undo:[],redo:[],hl:null,files:null,clean:false,touch:false,guides:[],all:{ratio:true,bg:true,color:true},ls:{font:0,size:0.8,bold:false,italic:false,color:null},g:{ratio:'9:16',border:5,gap:3,color:'#ffffff'}};

const newCollage=r=>({ids:[],slots:[],layout:null,ratio:r||S.g.ratio,border:null,gap:null,color:null,texts:{},w:{},free:null,fn:0,fh:false,fv:false});
const newText=s=>({s,size:S.ls.size,font:S.ls.font,bold:S.ls.bold,italic:S.ls.italic,color:S.ls.color,rot:0,dx:0,dy:0,sp:null});
const txt=(c,k)=>{const t=c.texts[k];return t&&t.s?t:null};

const leftCount=()=>S.photos.reduce((n,p,i)=>n+((p.gone||usesOf(i))?0:1),0);

const L=i=>({t:'leaf',i});

const C=(w,k)=>({t:'col',w,k});

    else{b+=gs.ay;const s=snapAxis(b,[0],ty,thr);b+=s.adj;if(s.guide!=null)S.guides.push({o:'h',p:s.guide});b=Math.min(ct.h,Math.max(b,t+mh))}
    f.x=l/ct.w;f.y=t/ct.h;f.w=(r-l)/ct.w;f.h=(b-t)/ct.h;
    render();return;
  }
  if(gs.mode==='dmove'){
    const d0=gs.hit.d,d=geom(c,W,H).divs.find(q=>q.nid===d0.nid&&q.j===d0.j);if(!d)return;
    gs.ad+=(d.o==='v'?dx:dy)/d.av*d.sum;
    const arr=c.w[d.nid],k=arr.length,ia=d.fl?k-1-d.j:d.j,ib=d.fl?k-2-d.j:d.j+1,min=d.sum*0.14;
    let a=gs.w0[ia]+gs.ad,b=gs.w0[ib]-gs.ad;
    if(a<min){b-=min-a;a=min}
    if(b<min){a-=min-b;b=min}
    if(Math.abs(a-b)<(a+b)*0.04){a=(a+b)/2;b=a}
    arr[ia]=a;arr[ib]=b;render();return;
  }
  if(gs.mode==='pan'){
    const i=gs.hit.i,s=c.slots[i],zi=zinfo(i);
    const z=s.fit?zi.zmin:clamp(s.zoom,zi.zmin,5),sc=zi.fill*z;
    const dw=zi.ph.w*sc,dh=zi.ph.h*sc;
    if(dw-zi.r.w>0.5)s.ox=clamp(s.ox+dx/((dw-zi.r.w)/2),-1,1);
    if(dh-zi.r.h>0.5)s.oy=clamp(s.oy+dy/((dh-zi.r.h)/2),-1,1);
    render();
  }
});
function endPtr(e,cancel){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(!gs){S.touch=false;return}
  clearTimeout(gs.timer);
  if(gs.mode==='tap'&&!cancel){
    const h=gs.hit;
    if(h.type==='slot'){
      const now=Date.now();
      if(S.tool==='layout'){S.sel=h.i}
      else if(lastTap&&lastTap.i===h.i&&now-lastTap.t<320){lastTap=null;toggleFit(h.i)}
      else{lastTap={i:h.i,t:now};S.sel=h.i;if(S.tool==='fit')buildSheet()}
    }else if(h.type==='text'){lastTap=null;openEditor(h.key)}
    else lastTap=null;
  }else if(gs.mode==='swap'){
    const t=S.hl,a=gs.hit.i;
    if(!cancel&&t!=null&&t!==a){
      pushUndo();const c=cur();
      [c.ids[a],c.ids[t]]=[c.ids[t],c.ids[a]];[c.slots[a],c.slots[t]]=[c.slots[t],c.slots[a]];
      S.sel=t;
    }
    S.hl=null;$('#ghost').style.display='none';
  }else if(gs.mode==='tpinch'){gs.tp=true;gs.mode='done'}
  else if(gs.mode==='pinch')gs.mode='done';
  if(ptrs.size===0){
    const rb=gs.tp;gs=null;S.touch=false;S.guides=[];
    if(rb&&S.editKey)buildSheet();
    render();
  }
}
cv.addEventListener('pointerup',e=>endPtr(e,false));
cv.addEventListener('pointercancel',e=>endPtr(e,true));
cv.addEventListener('wheel',e=>{
  if(S.clean||S.tool==='layout')return;
  const h=hitTest(cpt(e));if(h.type!=='slot')return;e.preventDefault();
  const s=cur().slots[h.i],zi=zinfo(h.i);
  const z=clamp((s.fit?zi.zmin:s.zoom)*(e.deltaY<0?1.08:0.93),zi.zmin,5);
  setZoom(s,z,zi.zmin);render();
},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
$('#stage').addEventListener('click',()=>{if(S.clean)setClean(false)});

/* storage */
let dbp=null;
function db(){
  if(!dbp)dbp=new Promise((res,rej)=>{const r=indexedDB.open('collage-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  return dbp;
}
async function dbGet(k){const d=await db();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbSet(k,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function dbClear(){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').clear();t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
let saveT;
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(saveState,900)}
async function saveState(){
  try{
    if(!S.photos.length){await dbClear();return}
    await dbSet('state',{v:1,photos:S.photos.map(p=>({w:p.w,h:p.h,thumb:p.thumb})),gone:S.photos.map((p,i)=>p.gone?i:-1).filter(i=>i>=0),collages:S.collages,g:S.g,all:S.all,cur:S.cur,ls:S.ls});
  }catch(e){}
}
function persistPhoto(i,p){dbSet('f'+i,p.file).catch(()=>{});if(p.pv)dbSet('p'+i,p.pv).catch(()=>{})}
async function blobCanvas(b){
  const url=URL.createObjectURL(b),im=new Image();
  try{im.src=url;await im.decode();const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);return c}
  finally{URL.revokeObjectURL(url)}
}
async function restore(){
  try{
    const st=await dbGet('state');
    if(!st||!st.photos||!st.photos.length)return;
    const pk=$('#pick');pk.disabled=true;
    const n=st.photos.length;
    for(let i=0;i<n;i++){
      const m=st.photos[i];let f=null,pv=null,cvs=null;
      try{f=await dbGet('f'+i);pv=await dbGet('p'+i);if(pv)cvs=await blobCanvas(pv)}catch(e){}
      if(!cvs||!f){const c0=document.createElement('canvas');c0.width=c0.height=2;S.photos.push({file:f,w:m.w,h:m.h,prev:c0,thumb:m.thumb,gone:true})}
      else S.photos.push({file:f,w:m.w,h:m.h,prev:cvs,thumb:m.thumb,gone:st.gone.includes(i)});
      pk.textContent=(i+1)+' / '+n;
    }
    Object.assign(S.g,st.g||{});Object.assign(S.all,st.all||{});Object.assign(S.ls,st.ls||{});
    S.collages=(st.collages&&st.collages.length?st.collages:[newCollage()]).map(c=>Object.assign(newCollage(),c));
    S.cur=Math.min(st.cur||0,S.collages.length-1);S.sel=0;
    buildTray();go('build');refresh();
    pk.disabled=false;pk.textContent='Collage';
  }catch(e){const pk=$('#pick');pk.disabled=false;pk.textContent='Collage'}
}

async function loadPhoto(f){
  const url=URL.createObjectURL(f),im=new Image();
  try{
    im.src=url;await im.decode();
    const w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,1400/Math.max(w,h));
    const pc=document.createElement('canvas');pc.width=Math.max(1,Math.round(w*k));pc.height=Math.max(1,Math.round(h*k));
    pc.getContext('2d').drawImage(im,0,0,pc.width,pc.height);
    const t=document.createElement('canvas');t.width=t.height=160;
    const m=Math.min(pc.width,pc.height);
    t.getContext('2d').drawImage(pc,(pc.width-m)/2,(pc.height-m)/2,m,m,0,0,160,160);
    const pv=await new Promise(r=>pc.toBlob(r,'image/jpeg',0.88));
    return{file:f,w,h,prev:pc,thumb:t.toDataURL('image/jpeg',0.75),pv,gone:false};
  }catch(err){return null}
  finally{URL.revokeObjectURL(url);im.src=''}
}
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  const first=$('#s-import').classList.contains('on'),pk=$('#pick');
  let done=0,bad=0;
  if(first){pk.disabled=true;pk.textContent='0 / '+files.length}
  for(let i=0;i<files.length;i+=3){
    const res=await Promise.all(files.slice(i,i+3).map(loadPhoto));
    res.forEach(r=>{done++;if(!r){bad++;return}S.photos.push(r);persistPhoto(S.photos.length-1,r);if(!first)addThumb(S.photos.length-1)});
    const msg=done+' / '+files.length;
    if(first)pk.textContent=msg;else toast(msg);
  }
  if(first){pk.disabled=false;pk.textContent='Collage'}
  if(!S.photos.length)return;
  if(first){S.collages=[newCollage()];S.cur=0;S.sel=0;buildTray();go('build')}
  S.files=null;refresh();
  if($('#lib').classList.contains('on'))buildLib();
  if(bad)toast(bad+' photo(s) could not be loaded');
};

function neIdx(){return S.collages.map((c,i)=>c.ids.length?i:-1).filter(i=>i>=0)}
function moveC(k,dir){
  const ne=neIdx(),a=ne[k],b=ne[k+dir];if(b==null)return;
  pushUndo();const cc=cur();[S.collages[a],S.collages[b]]=[S.collages[b],S.collages[a]];
  S.cur=Math.max(0,S.collages.indexOf(cc));showReview();
}
function delC(ci){
  pushUndo();const cc=cur();S.collages.splice(ci,1);
  if(!S.collages.length)S.collages.push(newCollage(S.g.ratio));
  const i=S.collages.indexOf(cc);S.cur=i>=0?i:Math.min(ci,S.collages.length-1);showReview();
}
function showReview(){
  go('review');S.files=null;
  const g=$('#grid');g.innerHTML='';
  const ne=neIdx();
  ne.forEach((ci,k)=>{
    const c=S.collages[ci];
    const d=document.createElement('div');d.className='cell';
    const q=document.createElement('canvas'),[a,b]=rWH(c.ratio);
    q.width=520;q.height=Math.round(520*b/a);draw(q,c,prevSrcs(),null);
    q.onclick=()=>{S.cur=ci;S.sel=0;S.tool=null;go('build');refresh()};
    const l=document.createElement('span');l.className='no';l.textContent=k+1;
    const bar=document.createElement('div');bar.className='cbar';
    const mk=(t,fn)=>{const x=document.createElement('button');x.textContent=t;x.onclick=ev=>{ev.stopPropagation();fn()};return x};
    bar.append(mk('‹',()=>moveC(k,-1)),mk('×',()=>delC(ci)),mk('›',()=>moveC(k,1)));
    d.append(q,l,bar);g.append(d);
  });
  const left=leftCount();
  $('#rsub').textContent=ne.length+' collages · '+left+' photo'+(left===1?'':'s')+' unused';
  $('#save').textContent='Save all ('+ne.length+')';
}
function exportSize(r){
  const [a,b]=rWH(r);let W,H;
  if(a>=b){W=4000;H=Math.round(4000*b/a)}else{H=4000;W=Math.round(4000*a/b)}
  if(W*H>12e6){const f=Math.sqrt(12e6/(W*H));W=Math.round(W*f);H=Math.round(H*f)}
  return[W,H];
}
async function loadFull(c){
  const m={},urls=[];
  for(const id of c.ids){
    const u=URL.createObjectURL(S.photos[id].file);urls.push(u);
    const im=new Image();im.src=u;await im.decode();m[id]=im;
  }
  return{m,free:()=>{urls.forEach(u=>URL.revokeObjectURL(u));Object.values(m).forEach(im=>im.src='')}};
}
async function prepare(){
  const busy=$('#busy');busy.classList.add('on');
  const list=neIdx().map(i=>S.collages[i]);
  const files=[];
  try{
    for(let j=0;j<list.length;j++){
      const c=list[j];busy.textContent='Rendering '+(j+1)+' / '+list.length;
      await new Promise(r=>setTimeout(r,30));
      const full=await loadFull(c),q=document.createElement('canvas'),[W,H]=exportSize(c.ratio);
      q.width=W;q.height=H;draw(q,c,full.m,null);
      const blob=await new Promise(r=>q.toBlob(r,'image/jpeg',0.93));
      full.free();q.width=q.height=0;
      files.push(new File([blob],'collage-'+String(j+1).padStart(2,'0')+'.jpg',{type:'image/jpeg'}));
    }
  }catch(err){busy.classList.remove('on');toast('Export failed: '+err.message);return}
  busy.classList.remove('on');S.files=files;
  $('#save').textContent='Tap to save '+files.length+' images';
}
async function deliver(){
  const files=S.files;
  try{
    if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}
  }catch(err){if(err.name==='AbortError')return}
  for(const f of files){
    const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.append(a);a.click();a.remove();
    await new Promise(r=>setTimeout(r,400));
  }
}
$('#save').onclick=()=>{S.files?deliver():prepare()};
$('#back').onclick=()=>{go('build');refresh()};
$('#rev').onclick=showReview;
$('#eye').onclick=()=>setClean(true);
$('#next').onclick=next;$('#prev').onclick=prev;$('#add').onclick=addCollage;

$('#over').onclick=()=>$('#act').classList.add('on');
$('#act').addEventListener('click',e=>{
  if(e.target.id==='act'){$('#act').classList.remove('on');return}
  const o=e.target.dataset&&e.target.dataset.o;if(!o)return;
  $('#act').classList.remove('on');
  if(o==='reset'){pushUndo();S.collages[S.cur]=newCollage(cur().ratio);S.sel=0;S.editKey=null;refresh()}
  else if(o==='dup'){pushUndo();const cp=JSON.parse(JSON.stringify(cur()));S.collages.splice(S.cur+1,0,cp);S.cur++;S.sel=0;refresh()}
  else if(o==='clear'){
    if(!confirm('Clear all collages? Your photos stay.'))return;
    pushUndo();S.collages=[newCollage(S.g.ratio)];S.cur=0;S.sel=0;S.tool=null;S.editKey=null;refresh();
  }else if(o==='scratch'){
    if(!confirm('Remove all photos and collages and start from scratch?'))return;
    S.photos=[];S.collages=[];S.undo=[];S.redo=[];S.cur=0;S.sel=0;S.tool=null;S.editKey=null;
    dbClear().catch(()=>{});$('#tray').innerHTML='';
    const pk=$('#pick');pk.disabled=false;pk.textContent='Collage';go('import');
  }
});
let sx=null;const crow=$('#crow');
crow.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
crow.addEventListener('touchend',e=>{
  if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
  if(dx>70)prev();else if(dx<-70)next();
},{passive:true});

function setTheme(t){
  document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);
  document.querySelector('meta[name=theme-color]').content=t==='dark'?'#000000':'#f5f5f7';
}
setTheme(localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
new ResizeObserver(()=>{if(S.collages.length)render()}).observe($('#stage'));
addEventListener('resize',()=>{if(S.collages.length)render()});
try{
  const ic=document.createElement('canvas');ic.width=ic.height=180;const x=ic.getContext('2d');
  const gr=x.createLinearGradient(0,0,180,180);gr.addColorStop(0,'#2c2c2e');gr.addColorStop(1,'#000000');
  x.fillStyle=gr;x.fillRect(0,0,180,180);x.fillStyle='#ffffff';
  [[32,32,70,116],[112,32,36,54],[112,94,36,54]].forEach(([a,b,w,h])=>{x.beginPath();x.roundRect(a,b,w,h,10);x.fill()});
  const lk=document.createElement('link');lk.rel='apple-touch-icon';lk.href=ic.toDataURL('image/png');document.head.append(lk);
}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
restore();
})();
</script>
